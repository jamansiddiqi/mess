<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATML Mess Manager</title>
<style>
:root{
  --bg:#f3f5f9;--surface:#fff;--surface2:#f7f9fc;--line:#e3e8f0;--line2:#edf1f6;
  --text:#0f172a;--muted:#64748b;--brand:#0f766e;--brand2:#14b8a6;--brandbg:#e3f5f2;
  --sb:#0b1b2e;--sb2:#13283f;--sbtext:#9fb2c8;
  --danger:#dc2626;--dangerbg:#fee2e2;--ok:#059669;--okbg:#d9f5ea;--warn:#b45309;--warnbg:#fef3c7;
  --cb:#f59e0b;--cl:#0d9488;--cd:#6366f1;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.05);--r:12px;
}
[data-theme=dark]{
  --bg:#0a111d;--surface:#111b2c;--surface2:#16233a;--line:#233250;--line2:#1b2942;
  --text:#e6edf7;--muted:#8da0ba;--brand:#2dd4bf;--brand2:#14b8a6;--brandbg:#0f2f33;
  --sb:#060d18;--sb2:#0e1b2e;--sbtext:#8396ae;
  --danger:#f87171;--dangerbg:#3b1a1f;--ok:#34d399;--okbg:#0f3326;--warn:#fbbf24;--warnbg:#3a2c0b;
  --cb:#fbbf24;--cl:#2dd4bf;--cd:#818cf8;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",Arial,Tahoma,Verdana,"Nirmala UI","Kalpurush","Noto Sans Bengali",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
/* sidebar */
.sidebar{background:linear-gradient(180deg,var(--sb),var(--sb2));color:var(--sbtext);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 14px;z-index:30}
.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:12px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#14b8a6,#0f766e);display:grid;place-items:center;color:#fff;font-weight:800;letter-spacing:.5px;font-size:13px;box-shadow:0 4px 14px rgba(20,184,166,.35)}
.brand b{display:block;color:#fff;font-size:14.5px;letter-spacing:.2px}
.brand span{font-size:11.5px;color:var(--sbtext)}
.nav{display:flex;flex-direction:column;gap:1px;overflow:auto}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:7px 11px;border-radius:9px;cursor:pointer;color:var(--sbtext);font-weight:500;font-size:12.5px;transition:.15s}
.nav button .ic,.nav button svg{width:16px;height:16px}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:rgba(20,184,166,.16);color:#fff;box-shadow:inset 3px 0 0 var(--brand2)}
.nav button:focus-visible{outline:2px solid var(--brand2)}
.nav .sep{font-size:9.5px;text-transform:uppercase;letter-spacing:1px;padding:10px 11px 4px;color:#5f7691}
.sb-foot{margin-top:auto;padding:12px;border-radius:12px;background:rgba(255,255,255,.05);font-size:12px}
.sb-foot b{color:#fff;display:block}
/* topbar */
.main{min-width:0}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 26px}
.topbar h1{margin:0;font-size:19px;letter-spacing:-.2px}
.topbar .sub{color:var(--muted);font-size:12.5px}
.grow{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.chip.warn i{background:var(--warn)}
.iconbtn{all:unset;box-sizing:border-box;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--text)}
.iconbtn:hover{border-color:var(--brand2)}
.iconbtn:focus-visible{outline:2px solid var(--brand2)}
#menuBtn{display:none}
.content{padding:22px 26px 60px;max-width:1500px;margin:0 auto}
/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card>header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.card>header h3{margin:0;font-size:14.5px}
.card>header small{color:var(--muted)}
.card .body{padding:16px 18px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.mt{margin-top:16px}
/* hero */
.hero{background:linear-gradient(120deg,#0b3b3a,#0f766e 55%,#14b8a6);color:#fff;border-radius:16px;padding:22px 26px;display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero:after{content:"";position:absolute;right:-60px;top:-80px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero h2{margin:0 0 4px;font-size:22px;letter-spacing:.3px}
.hero p{margin:2px 0;opacity:.9;font-size:13px}
.hero .prog{min-width:260px;position:relative;z-index:1}
.bar{height:9px;background:rgba(255,255,255,.22);border-radius:9px;overflow:hidden;margin:8px 0 6px}
.bar>span{display:block;height:100%;background:#fff;border-radius:9px}
.hero .big{font-size:26px;font-weight:700}
/* kpi */
.kpi{padding:8px 14px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 4px 4px 0;background:var(--k,var(--brand2))}
.kpi .l{color:var(--muted);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.kpi .v{font-size:18px;font-weight:700;margin:1px 0 0;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--muted);font-size:11px;line-height:1.3}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--brand2)}
.btn:focus-visible{outline:2px solid var(--brand2);outline-offset:1px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
[data-theme=dark] .btn.pri{color:#04201d}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.ghost{background:transparent}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
/* forms */
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:400;font-size:13.5px}
.inp:focus{outline:2px solid color-mix(in srgb,var(--brand2) 45%,transparent);border-color:var(--brand2)}
.search{position:relative;min-width:230px}
.search .ic{position:absolute;left:10px;top:9px;color:var(--muted);width:16px;height:16px}
.search .inp{padding-left:34px}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.switch{position:relative;width:38px;height:22px;display:inline-block}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:#cbd5e1;border-radius:22px;transition:.15s;cursor:pointer}
.switch span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked+span{background:var(--brand2)}
.switch input:checked+span:before{transform:translateX(16px)}
.switch input:focus-visible+span{outline:2px solid var(--brand2);outline-offset:2px}
/* tables */
.tw{overflow:auto;max-width:100%}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{position:sticky;top:0;background:var(--surface2);text-align:left;padding:7px 12px;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
table.t td{padding:4px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tbody tr:hover td{background:color-mix(in srgb,var(--brandbg) 45%,transparent)}
table.t tfoot td{font-weight:700;background:var(--surface2);border-top:2px solid var(--line)}
.r{text-align:right;font-variant-numeric:tabular-nums}
.c{text-align:center}
.muted{color:var(--muted)}
.nm b{font-weight:600}
.nm small{color:var(--muted);font-size:11.5px;margin-left:6px}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;border:0;font-family:inherit}
.b-ok{background:var(--okbg);color:var(--ok)}.b-bad{background:var(--dangerbg);color:var(--danger)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-gray{background:var(--line2);color:var(--muted)}.b-brand{background:var(--brandbg);color:var(--brand)}
button.badge{cursor:pointer}
.pos{color:var(--danger);font-weight:700}.neg{color:var(--ok);font-weight:700}
.act{display:flex;gap:6px;justify-content:flex-end}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
/* meal entry */
.datebar{display:flex;align-items:center;gap:8px}
.datebar .big{font-weight:700;font-size:16px;min-width:170px;text-align:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{all:unset;padding:7px 14px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--brand);color:#fff}
[data-theme=dark] .seg button.on{color:#04201d}
.seg button:focus-visible{outline:2px solid var(--brand2)}
.pills{display:flex;gap:10px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.pill i{width:10px;height:10px;border-radius:3px;display:inline-block}
.pill b{font-size:17px;font-variant-numeric:tabular-nums}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.step button{all:unset;width:26px;height:30px;text-align:center;cursor:pointer;color:var(--muted);font-weight:700;font-size:15px;user-select:none}
.step button:hover{background:var(--brandbg);color:var(--brand)}
.step button:focus-visible{outline:2px solid var(--brand2);outline-offset:-2px}
.step input{width:42px;border:0;text-align:center;background:transparent;font-weight:700;-moz-appearance:textfield;padding:0;height:30px;font-size:13.5px}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.step.on.b{border-color:var(--cb);background:color-mix(in srgb,var(--cb) 14%,transparent)}
.step.on.l{border-color:var(--cl);background:color-mix(in srgb,var(--cl) 14%,transparent)}
.step.on.d{border-color:var(--cd);background:color-mix(in srgb,var(--cd) 14%,transparent)}
.mh{display:flex;align-items:center;gap:6px;justify-content:center}
.mh i{width:9px;height:9px;border-radius:3px;display:inline-block}
.grid-wrap{max-height:calc(100vh - 230px);overflow:auto;border-radius:0 0 12px 12px}
table.mg{border-collapse:separate;border-spacing:0;font-size:12px}
table.mg th,table.mg td{padding:0;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);text-align:center;background:var(--surface)}
table.mg thead th{position:sticky;z-index:3;background:var(--surface2);font-size:11px}
table.mg thead tr:nth-child(1) th{top:0;height:26px;box-sizing:border-box}
table.mg thead tr:nth-child(2) th{top:26px;height:22px;box-sizing:border-box;font-weight:600;color:var(--muted)}
table.mg .s1,table.mg .s2,table.mg .s3{position:sticky;z-index:2;text-align:left}
table.mg thead .s1,table.mg thead .s2,table.mg thead .s3{z-index:5}
table.mg .s1{left:0;min-width:34px;padding:0 6px;text-align:center}
table.mg .s3{left:228px;min-width:62px;max-width:62px;padding:0 6px;text-align:right;border-right:2px solid var(--line);font-variant-numeric:tabular-nums}
table.mg .s2{left:34px;min-width:194px;max-width:194px;padding:0 8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
table.mg .s2{line-height:1.2}
table.mg tbody td{height:28px}
table.mg .s2 small{color:var(--muted);font-size:10.5px}
table.mg td input{width:34px;height:28px;border:0;text-align:center;background:transparent;font-size:12.5px;padding:0;-moz-appearance:textfield}
table.mg td input::-webkit-outer-spin-button,table.mg td input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
table.mg td input:focus{outline:2px solid var(--brand2);outline-offset:-2px;background:var(--brandbg)}
table.mg td.vc{min-width:34px;padding:0 3px;font-size:11.5px;color:var(--muted)}
table.mg td.vc.v1{color:var(--brand);font-weight:700}
table.mg td.v1 input{font-weight:700;color:var(--brand)}
table.mg .we{background:color-mix(in srgb,var(--warnbg) 55%,var(--surface))}
table.mg td.we input{background:transparent}
table.mg .today{box-shadow:inset 0 3px 0 var(--brand2)}
table.mg .tot{font-weight:700;background:var(--surface2);min-width:52px;padding:0 8px;position:sticky;right:0;z-index:2;border-left:2px solid var(--line)}
table.mg thead .tot{z-index:5}
table.mg tfoot td,table.mg tfoot th{position:sticky;bottom:0;background:var(--surface2);font-weight:700;z-index:2;height:28px}
table.mg tfoot th.s1,table.mg tfoot th.s2,table.mg tfoot th.s3,table.mg tfoot td.s3{z-index:4}
table.mg tfoot td.tot{z-index:4}
table.xl td{border-right:1px solid var(--line2)}
table.xl td.xc{padding:0}
.xin{width:100%;height:30px;border:0;background:transparent;text-align:center;font-weight:700;font-size:14px;padding:0;color:var(--text)}
.xin.has{background:color-mix(in srgb,var(--brandbg) 80%,transparent);color:var(--brand)}
.xin:focus{outline:2px solid var(--brand2);outline-offset:-2px;background:var(--brandbg)}
table.t tfoot td{padding:5px 12px}
/* charts */
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:10px;font-family:inherit}
svg.chart .gl{stroke:var(--line);stroke-width:1}
svg.chart rect.hov:hover{opacity:.8}
.hb{display:grid;grid-template-columns:minmax(80px,38%) 1fr auto;gap:10px;align-items:center;margin:9px 0;font-size:12.5px}
.hb .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .trk{height:9px;background:var(--line2);border-radius:9px;overflow:hidden}
.hb .trk span{display:block;height:100%;border-radius:9px;background:var(--brand2)}
.hb .val{font-variant-numeric:tabular-nums;font-weight:600}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border:0}
.kv span small{display:block;color:var(--muted);font-size:11px}
.kv b{font-variant-numeric:tabular-nums}
.kv.tot{font-size:14.5px}
.list .it{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2)}
.list .it:last-child{border:0}
.list .it small{color:var(--muted);display:block;font-size:11.5px}
.stackbar{display:flex;height:10px;border-radius:9px;overflow:hidden;background:var(--line2);margin:8px 0 2px}
/* modal */
.mback{position:fixed;inset:0;background:rgba(7,13,24,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px;overflow:auto;z-index:100}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.35);border:1px solid var(--line)}
.modal.wide{max-width:720px}
.modal header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line2)}
.modal header h3{margin:0;font-size:16px}
.modal .mb{padding:18px 20px;display:grid;gap:14px}
.modal footer{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line2);flex-wrap:wrap}
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:13px;animation:up .2s}
.toast.err{background:#b91c1c}
@keyframes up{from{transform:translateY(8px);opacity:0}}
.note{padding:11px 14px;border-radius:10px;background:var(--warnbg);color:var(--warn);font-size:12.5px}
.note.info{background:var(--brandbg);color:var(--brand)}
.bill-head{text-align:center;padding:18px 10px 6px}
.bill-head h2{margin:0;font-size:20px;letter-spacing:.5px}
.bill-head p{margin:2px 0;color:var(--muted);font-size:13px}
.hm{display:none}
/* print */
#printRoot{display:none}
@media print{
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:block}
  body{background:#fff;color:#000}
}
.pr{font-family:Arial,"Segoe UI",Tahoma,"Nirmala UI",sans-serif;color:#000;font-size:11px}
.pr h1{margin:0;text-align:center;font-size:19px;letter-spacing:.5px}
.pr .ph{text-align:center;margin-bottom:10px}
.pr .ph p{margin:2px 0;font-size:11.5px}
.pr table{width:100%;border-collapse:collapse}
.pr th,.pr td{border:1px solid #444;padding:3px 5px;text-align:left;position:static}
.pr td.r,.pr th.r{text-align:right}.pr .nm b{display:inline;font-weight:600}
.pr tfoot td{background:#f0f0f0}
.pr th{background:#e7e7e7;font-size:10px;text-align:center}
.pr td.n{text-align:right}.pr td.cc{text-align:center}
.pr tfoot td{font-weight:700;background:#f0f0f0}
.pr .sig{display:flex;justify-content:space-between;margin-top:46px;font-size:11px}
.pr .sig div{border-top:1px solid #000;padding-top:4px;min-width:150px;text-align:center}
.pr .foot{margin-top:10px;font-size:10px}
.pr.mealp table{font-size:8.5px}
.pr.mealp th,.pr.mealp td{padding:2px 1px;text-align:center}
.pr.mealp td.nn{text-align:left;white-space:nowrap;padding:2px 4px}
.pr .pb{page-break-after:always;break-after:page}
.pr .pb:last-child{page-break-after:auto;break-after:auto}
/* compact density */
.content{padding:12px 20px 50px}
.topbar{padding:7px 20px}.topbar h1{font-size:16.5px}.topbar .sub{font-size:11.5px}
.iconbtn{width:32px;height:32px;border-radius:8px}
.tools{gap:6px;margin-bottom:8px}
.tools .iconbtn{width:30px;height:30px}
.btn{padding:5px 10px;font-size:12.5px;gap:5px;border-radius:8px}
.btn .ic{width:15px;height:15px}
.btn.sm{padding:3px 8px;font-size:11.5px}
.seg button{padding:5px 11px;font-size:12.5px}
.inp,select.inp{padding:5px 9px;font-size:13px;border-radius:8px}
.datebar{gap:4px}.datebar .big{font-size:14px;min-width:150px}
.pills{gap:6px!important;margin-bottom:8px!important;align-items:center}
.pill{padding:3px 10px;gap:6px;border-radius:8px;font-size:12.5px}
.pill b{font-size:14.5px}.pill small{font-size:11px}
.pill i{width:8px;height:8px}
.grid-wrap{max-height:calc(100vh - 150px)}
table.xl td{padding-top:0;padding-bottom:0}
.xin{height:26px;font-size:13.5px}
table.t tfoot td{padding:3px 12px}
.card>header{padding:9px 14px}
.pills .pill{flex:none}.pill b{font-size:14px}
.tools{margin-bottom:6px}
.xin{height:25px}
table.t th{padding:5px 12px}
table.t th.r{text-align:right}table.t th.c{text-align:center}
.dd{position:relative;display:inline-block}

function dayList(){
  const S=db.settings;let n=diffDays(S.startDate,S.endDate)+1;
  n=clamp(isFinite(n)?n:30,1,62);
  return Array.from({length:n},(_,i)=>addDays(S.startDate,i));
}
const DEF_W={b:0.75,l:1.5,d:0.75};
const W=()=>{const w=(db&&db.settings&&db.settings.mealWeights)||DEF_W;return [w.b,w.l,w.d].map((x,i)=>isFinite(+x)&&+x>=0?+x:[.75,1.5,.75][i])};
const mv=a=>{const w=W();return a[0]*w[0]+a[1]*w[1]+a[2]*w[2]};
const getMeal=(date,mid)=>(db.meals[date]&&db.meals[date][mid])||[0,0,0];
function setMeal(date,mid,i,val){
  const cur=getMeal(date,mid).slice();cur[i]=toInt(val);
  if(!cur[0]&&!cur[1]&&!cur[2]){if(db.meals[date]){delete db.meals[date][mid];if(!Object.keys(db.meals[date]).length)delete db.meals[date];}}
  else{(db.meals[date]=db.meals[date]||{})[mid]=cur;}
  save();
}
function calc(){
  const S=db.settings;
  const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
  const mealShop=sum(db.shopping.filter(x=>x.costing==='Meal'),x=>x.cost);
  const othersShop=sum(db.shopping.filter(x=>x.costing==='Others'),x=>x.cost);
  const cashSpend=sum(db.shopping.filter(x=>x.purchase==='Cash'),x=>x.cost);
  const loan=sum(db.shopping.filter(x=>x.purchase==='Loan'),x=>x.cost);
  const deposit=sum(db.deposits,x=>x.amount);
  const memIds=new Set(db.members.map(m=>m.id)),w=W();
  const mm={},day={};let B=0,L=0,D=0;
  for(const [date,rec] of Object.entries(db.meals)){
    for(const [mid,a] of Object.entries(rec)){
      if(!memIds.has(mid))continue;
      const vb=a[0]*w[0],vl=a[1]*w[1],vd=a[2]*w[2];
      mm[mid]=(mm[mid]||0)+vb+vl+vd;
      const t=day[date]=day[date]||{b:0,l:0,d:0,t:0,n:0};
      t.b+=vb;t.l+=vl;t.d+=vd;t.t+=vb+vl+vd;t.n++;
      B+=vb;L+=vl;D+=vd;
    }
  }
  const totalMeals=B+L+D;
  const mgrN=db.members.filter(x=>x.manager).length,frac=mgrN?1/mgrN:0;
  // manager's meals are only partly counted: 1 manager → 0 (free), 2 managers → half each
  const cnt=m=>(mm[m.id]||0)*(m.manager?1-frac:1);
  const countedMeals=db.members.reduce((t,m)=>t+cnt(m),0);
  const rate=countedMeals>0?mealShop/countedMeals:0;
  const dm={};db.deposits.forEach(x=>dm[x.memberId]=(dm[x.memberId]||0)+x.amount);
  const rows=db.members.filter(m=>m.active||mm[m.id]||dm[m.id]).map(m=>({m,meals:mm[m.id]||0,counted:cnt(m),deposit:dm[m.id]||0}));
  const othersCount=rows.filter(r=>r.m.othersBill&&!r.m.manager).length;
  const othersPool=Math.max(0,othersShop-(Number(S.gasBill)||0));
  // manager pays no / half of the others share, so the pool is divided by *weighted* heads – the rest is carried by the other members (money in = money out)
  const othersWeight=rows.reduce((t,r)=>t+(r.m.othersBill?(r.m.manager?1-frac:1):0),0);
  const othersPerHead=othersWeight?othersPool/othersWeight:0;
  let due=0,refund=0,dueN=0,refN=0,grandAll=0,payAll=0,freeAll=0;
  rows.forEach(r=>{
    r.mealCost=r.counted*rate;
    r.others=r.m.othersBill?othersPerHead*(r.m.manager?1-frac:1):0; // manager: others bill also free / half
    r.grand=r.mealCost+r.others;
    if(S.roundBills)r.grand=Math.round(r.grand);
    r.free=0;
    r.prev=r.m.prevDue||0;
    r.payable=r.grand-r.deposit+r.prev;
    if(S.roundBills)r.payable=Math.round(r.payable);
    if(r.payable>0.0049){due+=r.payable;dueN++}else if(r.payable<-0.0049){refund+=-r.payable;refN++}
    grandAll+=r.grand;payAll+=r.payable;
  });
  const inhand=deposit-cashSpend;
  return {countedMeals,mealShop,othersShop,shopTotal:mealShop+othersShop,cashSpend,loan,deposit,B,L,D,totalMeals,rate,rows,day,othersCount,othersPool,othersPerHead,
    due,refund,dueN,refN,grandAll,payAll,inhand,helper:Number(S.helperCash)||0,mgrCash:inhand-(Number(S.helperCash)||0),
    depositors:Object.keys(dm).length,hasPrev:rows.some(r=>r.prev),mgrN,freeAll};
}

function mealChart(days,c){
  const mx0=Math.max(0,...days.map(d=>(c.day[d]||{t:0}).t));
  if(!mx0)return `<div class="empty">No meal entries yet.<br>Open <b>Meal Entry</b> to record breakfast / lunch / dinner.</div>`;
  const step=mx0<=10?2:mx0<=30?5:mx0<=60?10:20, mx=Math.ceil(mx0/step)*step;
  const W=760,H=250,pl=34,pr=6,pt=10,pb=28,iw=W-pl-pr,ih=H-pt-pb,bw=iw/days.length,td=today();
  let g='';
  for(let v=0;v<=mx;v+=step){const y=pt+ih-v/mx*ih;g+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+3}" text-anchor="end">${v}</text>`}
  let bars='';
  days.forEach((d,i)=>{
    const t=c.day[d]||{b:0,l:0,d:0,t:0};const x=pl+i*bw+bw*.19,w=bw*.62;let y=pt+ih;
    [['b','var(--cb)'],['l','var(--cl)'],['d','var(--cd)']].forEach(([k,col])=>{
      const h=t[k]/mx*ih;if(h>0){y-=h;bars+=`<rect class="hov" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="${col}"><title>${dsh(d)} ${wd(d)} — B ${fmtn(t.b)} · L ${fmtn(t.l)} · D ${fmtn(t.d)} = ${fmtn(t.t)}</title></rect>`}
    });
    const dn=parseD(d).getDate();
    g+=`<text x="${(pl+i*bw+bw/2).toFixed(1)}" y="${H-10}" text-anchor="middle" ${d===td?'style="fill:var(--brand);font-weight:700"':''}>${dn}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily meals stacked bar chart">${g}${bars}</svg>`;
}

function crc32(buf){let t=crc32.t;if(!t){t=crc32.t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}}
  let crc=0xFFFFFFFF;for(let i=0;i<buf.length;i++)crc=t[(crc^buf[i])&255]^(crc>>>8);return(crc^0xFFFFFFFF)>>>0}
function zipStore(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  files.forEach(f=>{
    const nm=enc.encode(f.name),data=enc.encode(f.text),crc=crc32(data),sz=data.length;
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(12,0x21,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(lh.buffer),nm,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(14,0x21,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    cen.push(new Uint8Array(ch.buffer),nm);off+=30+nm.length+sz;
  });
  const cs=cen.reduce((t,a)=>t+a.length,0),end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cs,true);end.setUint32(16,off,true);
  return new Blob([...parts,...cen,new Uint8Array(end.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
const xe=s=>String(s).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function buildXlsx(sheetName,rows,{widths=[],merges=[],freeze=null}={}){

function gridExcelRows(){
  const days=dayList(),mem=db.members.filter(m=>m.active),w=W(),S=db.settings,cm=ui.gridMode==='count',dep=depByMember();
  const gv=(a,k)=>cm?a[k]:a[k]*w[k];
  const nC=3+days.length*3+1,rows=[],merges=[];
  const blank=n=>Array(n).fill(null);
  rows.push([[S.messName,1],...blank(nC-1)]);
  rows.push([[`Month of ${S.month} — Meal grid (${cm?'entries':'meal value = entry × value'}) · Meal value: B ${fmtn(w[0])} · L ${fmtn(w[1])} · D ${fmtn(w[2])}`,0],...blank(nC-1)]);
  rows.push(blank(nC));
  const h1=[['SL',2],['Name',2],['Deposit',2]],h2=[['',2],['',2],['',2]];
  days.forEach((d,i)=>{const c0=3+i*3;h1.push([`${dsh(d)} ${wd(d)}`,2],['',2],['',2]);h2.push(['B',2],['L',2],['D',2]);merges.push(`${colL(c0)}4:${colL(c0+2)}4`)});
  h1.push([cm?'Total entries':'Total meal',2]);h2.push(['',2]);
  rows.push(h1,h2);
  merges.push('A4:A5','B4:B5','C4:C5',`${colL(nC-1)}4:${colL(nC-1)}5`,`A1:${colL(Math.min(nC-1,12))}1`,`A2:${colL(Math.min(nC-1,12))}2`);
  const colT=Array(days.length*3).fill(0);let gt=0,dt=0;
  mem.forEach((m,i)=>{
    const r=[[i+1,4],[nDU(m),3],[dep[m.id]||'',7]];let t=0;dt+=dep[m.id]||0;
    days.forEach((d,di)=>{const a=getMeal(d,m.id);[0,1,2].forEach(k=>{const v=gv(a,k);t+=v;colT[di*3+k]+=v;r.push([v?v:'',4])})});
    gt+=t;r.push([t,5]);rows.push(r);
  });
  rows.push([['',6],['Total',6],[dt,8],...colT.map(v=>[v||'',5]),[gt,5]]);
  const widths=[5,34,11,...Array(days.length*3).fill(5.2),12];
  return {rows,opt:{widths,merges,freeze:[3,5]}};
}
function excelGrid(){
  const {rows,opt}=gridExcelRows();
  const blob=buildXlsx('Meal Grid',rows,opt);
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`Meal_Grid_${(db.settings.month||'month').replace(/[^\w-]+/g,'_')}.xlsx`;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800);toast('Excel file downloaded');
}

const PEND_LIMIT=10;
/* bill data; on the "Final Bill Pending" page rows with |balance| ≤ 10 (settled / tiny) are removed */
function calcB(){
  const c=calc();if(ui.view!=='billpend')return c;
  const pf=ui.pendF||'all',rows=c.rows.filter(r=>Math.abs(r.payable)>PEND_LIMIT&&(pf==='all'||(pf==='due'?r.payable>0:r.payable<0)));
  let due=0,refund=0,dueN=0,refN=0;rows.forEach(r=>{if(r.payable>0){due+=r.payable;dueN++}else{refund-=r.payable;refN++}});
  const sum=f=>rows.reduce((t,r)=>t+f(r),0);
  return Object.assign({},c,{rows,due,refund,dueN,refN,grandAll:sum(r=>r.grand),payAll:sum(r=>r.payable),countedMeals:c.countedMeals,hasPrev:rows.some(r=>r.prev),pend:true,pf,_sm:sum(r=>r.counted)});
}

function billTable(c,print){
  const S=db.settings,m=print?(n=>fmt(n,S.roundBills?0:2)):money;
  const P=c.hasPrev;
  const head=`<tr><th>SL</th><th>Name - Desig. - Unit</th><th class="r">Deposit</th>${P?'<th class="r">Prev. due</th>':''}<th class="r">Total meal</th><th class="r">Cost / meal</th><th class="r">Meal cost</th><th class="r">Others / head</th><th class="r">Grand total</th><th class="r">Balance</th></tr>`;
  const rows=c.rows.map((r,i)=>{
    const pay=r.payable,cls=pay>0.0049?'pos':pay<-0.0049?'neg':'';
    const payTxt=pay>0.0049?m(pay):pay<-0.0049?'−'+m(-pay):'0';
    const tag=print?'':(pay>0.0049?' <span class="badge b-bad">Due</span>':pay<-0.0049?' <span class="badge b-ok">Refund</span>':' <span class="badge b-gray">Settled</span>');
    const mg=r.m.manager?(print?' (Manager)':' <span class="badge b-brand">Manager</span>'):'';
    return `<tr><td>${i+1}</td><td class="nm"><b>${esc(nDU(r.m))}</b>${mg}</td><td class="r">${m(r.deposit)}</td>${P?`<td class="r">${m(r.prev)}</td>`:''}<td class="r">${print&&r.m.manager?'0':fmtn(r.counted)+(r.m.manager&&r.meals?` <small class="muted">(of ${fmtn(r.meals)})</small>`:'')}</td><td class="r">${r.counted?fmt(c.rate,2):''}</td><td class="r">${r.counted?fmt(r.mealCost,2):''}</td><td class="r">${r.m.othersBill?fmt(r.others,2):'—'}</td><td class="r">${m(r.grand)}</td><td class="r ${print?'':cls}" style="${print?'font-weight:700':''}">${payTxt}${tag}</td></tr>`}).join('');
  const sp=c.rows.reduce((t,r)=>t+r.mealCost,0),so=c.rows.reduce((t,r)=>t+r.others,0),sd=c.rows.reduce((t,r)=>t+r.deposit,0),sm=c.pend?c._sm:c.countedMeals;
  const foot=`<tr><td colspan="2">Total</td><td class="r">${m(sd)}</td>${P?`<td class="r">${m(c.rows.reduce((t,r)=>t+r.prev,0))}</td>`:''}<td class="r">${fmtn(sm)}</td><td class="r">${c.countedMeals?fmt(c.rate,2):''}</td><td class="r">${fmt(sp,2)}</td><td class="r">${fmt(so,2)}</td><td class="r">${m(c.grandAll)}</td><td class="r">${c.payAll<0?'−':''}${m(Math.abs(c.payAll))}</td></tr>`;
  return `<table class="${print?'':'t'}"><thead>${head}</thead><tbody>${rows||`<tr><td colspan="12" class="empty">No members</td></tr>`}</tbody><tfoot>${foot}</tfoot></table>`;
}

async function importObj(obj,msg){

function billCSV(){
  const c=calcB(),q=v=>`"${String(v??'').replace(/"/g,'""')}"`;

function printMeals(from,to){
  const days=dayList().filter(d=>(!from||d>=from)&&(!to||d<=to)),mem=db.members.filter(m=>m.active),S=db.settings,per=16,w=W();
  const chunks=[];for(let i=0;i<days.length;i+=per)chunks.push(days.slice(i,i+per));
  const dep=depByMember();const grand={};mem.forEach(m=>grand[m.id]=days.reduce((s,d)=>s+mv(getMeal(d,m.id)),0));
  const html=chunks.map((ch,ci)=>{
    const last=ci===chunks.length-1;
    const h1=ch.map(d=>`<th colspan="3">${dsh(d)}<br>${wd(d)}</th>`).join('');
    const h2=ch.map(()=>'<th>B</th><th>L</th><th>D</th>').join('');
    const body=mem.map((m,i)=>`<tr><td>${i+1}</td><td class="nn">${esc(nDU(m))}</td><td>${dep[m.id]?fmt(dep[m.id]):''}</td>${ch.map(d=>getMeal(d,m.id).map((v,k)=>`<td>${v?fmtn(v*w[k]):''}</td>`).join('')).join('')}${last?`<td><b>${fmtn(grand[m.id])}</b></td>`:''}</tr>`).join('');
    const foot=ch.map(d=>[0,1,2].map(k=>`<td>${fmtn(mem.reduce((t,m)=>t+getMeal(d,m.id)[k]*w[k],0))||''}</td>`).join('')).join('');
    return `<div class="pb"><div class="ph"><h1>${esc(S.messName)} — Meal Sheet</h1><p>Month of ${esc(S.month)} · ${dfmt(ch[0])} to ${dfmt(ch[ch.length-1])} · Meal value: B ${fmtn(w[0])} · L ${fmtn(w[1])} · D ${fmtn(w[2])}</p></div>
      <table><thead><tr><th rowspan="2">SL</th><th rowspan="2" style="min-width:190px">Name - Desig. - Unit</th><th rowspan="2">Deposit</th>${h1}${last?'<th rowspan="2">Total</th>':''}</tr><tr>${h2}</tr></thead><tbody>${body}</tbody>
      <tfoot><tr><td></td><td class="nn">Total</td><td>${fmt(mem.reduce((t,m)=>t+(dep[m.id]||0),0))}</td>${foot}${last?`<td>${fmtn(Object.values(grand).reduce((a,b)=>a+b,0))}</td>`:''}</tr></tfoot></table></div>`;
  }).join('');
  doPrint(`<div class="pr mealp">${html}</div>`,true);
}

/* element → PNG (no libraries): clone with computed styles inside an SVG foreignObject.
   Self-contained so it can also be embedded in the downloaded HTML. */
function elToPng(el,opt){
  opt=opt||{};
  return new Promise((resolve,reject)=>{
    try{
      let W=Math.ceil(Math.max(el.getBoundingClientRect().width,el.scrollWidth));
      el.querySelectorAll('*').forEach(x=>{W=Math.max(W,Math.ceil(x.scrollWidth||0))});
      const clone=el.cloneNode(true),src=[el].concat([...el.querySelectorAll('*')]),dst=[clone].concat([...clone.querySelectorAll('*')]);
      for(let i=0;i<src.length;i++){
        const o=src[i],c=dst[i];if(!c.style)continue;
        const cs=getComputedStyle(o);let t='';
        for(let k=0;k<cs.length;k++){const n=cs[k];t+=n+':'+cs.getPropertyValue(n)+';'}
        c.setAttribute('style',t);
        if(/^(TD|TH|TR|TABLE|COL)$/.test(c.tagName)){c.style.removeProperty('width');c.style.removeProperty('min-width');c.style.removeProperty('max-width');c.style.removeProperty('height');c.style.removeProperty('inline-size');c.style.removeProperty('block-size')}
        if(c.tagName==='TABLE')c.style.width='100%';
        if(cs.overflowX!=='visible'||cs.overflowY!=='visible'){c.style.overflow='visible';c.style.maxHeight='none';if(c!==clone)c.style.height='auto'}
        if(cs.position==='sticky'||cs.position==='fixed')c.style.position='static';
        if(c.tagName==='INPUT')c.setAttribute('value',o.value);
      }
      (opt.hide||'[data-noimg]').split(',').forEach(q=>clone.querySelectorAll(q).forEach(n=>n.remove()));
      const solid=x=>x&&x!=='rgba(0, 0, 0, 0)'&&x!=='transparent';
      const bg=getComputedStyle(document.body).backgroundColor,sf=getComputedStyle(el).backgroundColor,pad=opt.pad==null?12:opt.pad;
      if(opt.width)W=opt.width;clone.style.width=W+'px';clone.style.margin='0';clone.style.boxSizing='border-box';
      const wrap=document.createElement('div');wrap.setAttribute('xmlns','http://www.w3.org/1999/xhtml');
      wrap.style.cssText='display:inline-block;padding:'+pad+'px;background:'+(solid(opt.bg)?opt.bg:solid(sf)?sf:solid(bg)?bg:'#fff');
      wrap.appendChild(clone);
      const host=document.createElement('div');host.style.cssText='position:fixed;left:-99999px;top:0;';host.appendChild(wrap);document.body.appendChild(host);
      const r=wrap.getBoundingClientRect(),fw=Math.ceil(r.width),fh=Math.ceil(r.height);
      const xml=new XMLSerializer().serializeToString(wrap);host.remove();
      const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+fw+'" height="'+fh+'"><foreignObject x="0" y="0" width="100%" height="100%">'+xml+'</foreignObject></svg>';
      const im=new Image(),sc=opt.scale||2;
      im.onload=()=>{try{
        const cv=document.createElement('canvas');cv.width=fw*sc;cv.height=fh*sc;const g=cv.getContext('2d');g.scale(sc,sc);g.drawImage(im,0,0,fw,fh);
        cv.toBlob(b=>b?resolve(b):reject(new Error('Could not create image')),'image/png');
      }catch(e){reject(e)}};
      im.onerror=()=>reject(new Error('Could not render image'));
      im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
    }catch(e){reject(e)}
  });
}
/* copy PNG to the clipboard; falls back to downloading it.  notify(msg,isErr) */
async function copyPng(el,name,notify,opt){
  const say=notify||(()=>{});
  const save=blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'.png';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800)};
  let blob;
  try{blob=await elToPng(el,opt)}catch(e){say('Image could not be created: '+e.message,true);return}
  try{
    if(!navigator.clipboard||!window.ClipboardItem)throw new Error('no clipboard');
    await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);say('Image copied — paste it in WhatsApp / Word / email');
  }catch(e){save(blob);say('Clipboard blocked by browser — image downloaded as '+name+'.png')}
}

  const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const p2=n=>String(n).padStart(2,'0');

  const dsh=s=>{const d=pd(s);return p2(d.getDate())+' '+MON[d.getMonth()]};
  const dfull=s=>dsh(s)+' '+pd(s).getFullYear();
  const wd=s=>WD[pd(s).getDay()];
  const nowD=new Date(),todayIso=nowD.getFullYear()+'-'+p2(nowD.getMonth()+1)+'-'+p2(nowD.getDate());
  const get=(d,id)=>(D.meals[d]&&D.meals[d][id])||[0,0,0];
  const W=D.w,S=D.settings;
  const IC={left:'<path d="m15 18-6-6 6-6"/>',right:'<path d="m9 18 6-6-6-6"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',
    print:'<path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',
    search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
    sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
    image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>',
    moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>'};
  const ic=n=>'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+IC[n]+'</svg>';
  const stats=m=>{const cnt=[0,0,0];D.days.forEach(d=>{const a=get(d,m.id);cnt[0]+=a[0];cnt[1]+=a[1];cnt[2]+=a[2]});const val=cnt.map((c,k)=>c*W[k]);return {cnt,val,tot:val[0]+val[1]+val[2]}};
  let q='',cur=-1;

  /* ---------- sheet ---------- */
  function totals(){let all=0;const col={};D.members.forEach(m=>m.manager||D.days.forEach(d=>{const a=get(d,m.id);for(let k=0;k<3;k++){col[d+k]=(col[d+k]||0)+a[k]*W[k];all+=a[k]*W[k]}}));return {all,col}}
  function bodyRows(){
    const ql=q.trim().toLowerCase(),dep=D.showDep;
    return D.members.map((m,i)=>({m,i})).filter(x=>!ql||(x.m.name+' '+dg(x.m)).toLowerCase().indexOf(ql)>=0).map(x=>{
      const m=x.m;let tot=0;

      return '<tr data-i="'+x.i+'" tabindex="0" title="Click to see '+esc(m.name)+'’s meal report"><td class="s1 muted">'+(x.i+1)+'</td><td class="s2">'+esc(m.name)+' <small>'+esc(dg(m))+'</small>'+(m.manager?' <span class="badge b-brand" style="font-size:9.5px;padding:0 6px">Manager</span>':'')+'</td>'+(dep?'<td class="s3">'+(m.deposit?fmt(m.deposit):'')+'</td>':'')+tds+'<td class="tot">'+(m.manager?'':fn(tot))+'</td></tr>';

    root.innerHTML=hero+

      (D.standalone?'<button class="iconbtn" id="shTheme" aria-label="Theme">'+ic(D.theme==='dark'?'sun':'moon')+'</button>':'')+'</div>'+
      '<div class="card"><header><h3>Meal sheet — view only</h3><small>Click a member row to open the individual report</small></header>'+
      '<div class="grid-wrap"><table class="mg rowlink"><thead><tr><th class="s1" rowspan="2">#</th><th class="s2" rowspan="2">Name</th>'+(dep?'<th class="s3" rowspan="2">Deposit</th>':'')+th1+'<th class="tot" rowspan="2">Total meal</th></tr><tr>'+th2+'</tr></thead>'+
      '<tbody id="shBody">'+bodyRows()+'</tbody><tfoot><tr><th class="s1"></th><th class="s2">Total</th>'+(dep?'<td class="s3" style="background:var(--surface2);font-weight:700">'+fmt(depTot)+'</td>':'')+foot+'<td class="tot">'+fn(t.all)+'</td></tr></tfoot></table></div></div>';
    const tc=$('#shToday',root),w=$('.grid-wrap',root);
    if(tc&&w&&!D.standalone){const last=$('th.s3',w)||$('th.s2',w);const sw=last.getBoundingClientRect().right-w.getBoundingClientRect().left;w.scrollLeft=Math.max(0,w.scrollLeft+tc.getBoundingClientRect().left-w.getBoundingClientRect().left-sw)}
  }
  root.addEventListener('click',e=>{

  root.addEventListener('input',e=>{if(e.target.id==='shQ'){q=e.target.value;$('#shBody',root).innerHTML=bodyRows()}});

  /* ---------- individual report ---------- */
  function initials(n){const p=String(n).replace(/[^A-Za-zঀ-৿ ]/g,' ').trim().split(/\s+/);return ((p[0]||'?').charAt(0)+(p.length>1?p[p.length-1].charAt(0):'')).toUpperCase()}
  function report(m){

/* ================= BALANCE SHEET (commercial statements) ================= */
function balData(){
  const c=calc(),S=db.settings,sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
  const cashBy=k=>sum(db.shopping.filter(x=>x.purchase==='Cash'&&x.costing===k),x=>x.cost);
  const billedMeal=sum(c.rows,r=>r.mealCost),billedOthers=sum(c.rows,r=>r.others),billed=c.grandAll;
  const gasCo=Math.max(0,c.othersShop-c.othersPool);          // part of "Others" paid by the company (gas bill)
  const prev=sum(c.rows,r=>r.prev);
  const assets=c.mgrCash+c.helper+c.due+gasCo,liab=c.loan+c.refund;
  const dset=new Set([...db.deposits.map(x=>x.date),...db.shopping.map(x=>x.date)].filter(Boolean)),days=[...dset].sort(),led=[];let bal=0;
  days.forEach(d=>{const i=sum(db.deposits.filter(x=>x.date===d),x=>x.amount),o=sum(db.shopping.filter(x=>x.date===d&&x.purchase==='Cash'),x=>x.cost),l=sum(db.shopping.filter(x=>x.date===d&&x.purchase==='Loan'),x=>x.cost);
    const op=bal;bal=op+i-o;if(i||o||l)led.push({d,op,i,o,l,bal})});
  return {c,S,cashMeal:cashBy('Meal'),cashOth:cashBy('Others'),billedMeal,billedOthers,billed,gasCo,prev,assets,liab,
    income:billed+gasCo,expense:c.shopTotal,surplus:billed+gasCo-c.shopTotal,diff:assets-liab-prev,led};
}

}
const fn2=n=>Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
function balHead(){const S=db.settings;return `<div class="bill-head"><h2>${esc(S.messName)}</h2><p><b>Balance Sheet</b></p><p>${esc(S.month)} · as on ${dfmt(clamp(today(),dayList()[0],dayList()[dayList().length-1]))}</p><p>Manager: ${esc(S.manager||'')} ${S.helperName?'· Cash with: '+esc(S.helperName):''}</p></div>`}
function vBalance(){
  return `<div class="tools"><span class="grow"></span><button class="btn" data-act="imgBal">${ico('image')} Copy image</button><button class="btn" data-act="printBal">${ico('print')} Print</button></div>
  <div id="balCard" style="padding:2px">${balHead()}${balBody(false)}</div>`;
}
Object.assign(A,{
  imgBal:()=>copyPng($('#balCard'),'Balance_Sheet_'+mname(),(m,e)=>toast(m,e?'err':''),{pad:14}),
  printBal:()=>doPrint(`<div class="pr">${balHead().replace('class="bill-head"','class="ph"').replace('<h2>','<h1>').replace('</h2>','</h1>')}${balBody(true)}</div>`,false)
});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const f=A[t.dataset.act];if(f){if(t.dataset.act!=='mback')e.preventDefault();f(t,e)}
});
const CH={
  actDate:t=>{if(t.value){ui.actDate=t.value;render(true)}},
  mealDate:t=>{const d=dayList();if(t.value){ui.mealDate=clamp(t.value,d[0],d[d.length-1]);render(true)}},
  mealInput:t=>{setMeal(ui.mealDate,t.dataset.m,+t.dataset.i,t.value);const v=toInt(t.value);t.value=v||'';t.classList.toggle('has',!!v);refreshDaily(t.dataset.m)},
  gridInput:t=>{setMeal(t.dataset.d,t.dataset.m,+t.dataset.i,t.value);const v=toInt(t.value);t.value=v||'';t.parentElement.classList.toggle('v1',!!v);refreshGridTotals(t.dataset.d,t.dataset.m)},
  memFlag:t=>{const m=db.members.find(x=>x.id===t.dataset.id),f=t.dataset.f;
    if(f==='manager'&&t.checked){const cur=db.members.filter(x=>x.manager&&x.id!==m.id);
      if(cur.length>=2){t.checked=false;alertBox(`Only <b>2 managers</b> can be selected.<br>Turn <b>off</b> one of the current managers first:<br>• ${cur.map(x=>esc(x.name)).join('<br>• ')}`);return}}
    m[f]=t.checked;save();render(true)},
  depMember:t=>{ui.depMember=t.value;$('#depTable').innerHTML=depTable()},
  shopF:t=>{ui.shop[t.dataset.f]=t.value;$('#shopTable').innerHTML=shopTable();if(t.dataset.f==='from'||t.dataset.f==='to')render(true)}
};
document.addEventListener('focusin',e=>{if(e.target.dataset&&e.target.dataset.ms==='q'){e.target.select();msSuggest(e.target)}});
document.addEventListener('mousedown',e=>{
  const b=e.target.closest('[data-ms=pick]');
  if(b){e.preventDefault();const w=b.closest('.dsr'),m=db.members.find(x=>x.id===b.dataset.id);w.querySelector('[name=memberId]').value=m.id;w.querySelector('[data-ms=q]').value=m.name+' — '+dg(m);w.querySelector('.sug').hidden=true;return}
  if(!e.target.closest('.dsr'))document.querySelectorAll('.dsr .sug').forEach(x=>x.hidden=true);
});
document.addEventListener('change',e=>{const t=e.target.closest('[data-on]');if(t&&CH[t.dataset.on])CH[t.dataset.on](t,e)});
document.addEventListener('input',e=>{
  if(e.target.dataset&&e.target.dataset.ms==='q'){msSuggest(e.target);return}
  if(e.target.matches&&e.target.matches('input[data-nav]')){e.target.value=e.target.value.replace(/\D/g,'').slice(0,2);return}
  const t=e.target.closest('[data-oninput]');if(!t)return;
  if(t.dataset.oninput==='depq'){ui.depq=t.value;$('#depTable').innerHTML=depTable()}
  if(t.dataset.oninput==='memq'){ui.memq=t.value;$('#memTable').innerHTML=memTable()}
  if(t.dataset.oninput==='shopq'){ui.shop.q=t.value;$('#shopTable').innerHTML=shopTable()}
});
// Excel-like keyboard navigation for meal cells (arrows / Enter), select-all on focus
document.addEventListener('keydown',e=>{
  const t=e.target;if(!t.matches||!t.matches('input[data-nav]'))return;
  let nr=+t.dataset.r,nc=+t.dataset.c;
  switch(e.key){case 'ArrowDown':case 'Enter':nr++;break;case 'ArrowUp':nr--;break;case 'ArrowRight':nc++;break;case 'ArrowLeft':nc--;break;default:return}
  e.preventDefault();
  const n=t.closest('table').querySelector(`input[data-nav][data-r="${nr}"][data-c="${nc}"]`);
  if(n)n.focus();
});
document.addEventListener('focusin',e=>{const t=e.target;if(t.matches&&t.matches('input[data-nav]')){t.select();setTimeout(()=>t.select(),0)}});
document.addEventListener('dblclick',async e=>{
  const t=e.target.closest('[data-dbl]');if(!t)return;
  const x=db.shopping.find(i=>i.id===t.dataset.id);if(!x)return;
  const f=t.dataset.dbl,next=f==='purchase'?(x.purchase==='Cash'?'Loan':'Cash'):(x.costing==='Meal'?'Others':'Meal'),label=f==='purchase'?'Payment':'Costing';
  if(await confirmBox(`Change <b>${label}</b> of <b>${esc(x.item)}</b> from <b>${esc(x[f])}</b> to <b>${next}</b>?`,'OK')){x[f]=next;save();render(true);toast(`${label} changed to ${next}`)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modalRoot').innerHTML){const no=$('[data-act="cfNo"]');no?no.click():closeModal()}});
$('#fileIn').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{await importObj(JSON.parse(await f.text()))}catch(err){toast('Could not read JSON file','err')}
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  const fd=new FormData(f),g=k=>(fd.get(k)??'').toString().trim(),kind=f.dataset.form,id=f.dataset.id;
  const again=e.submitter&&e.submitter.dataset.again;
  if(kind==='member'){
    const o={name:g('name'),desig:g('desig'),unit:g('unit'),prevDue:Number(g('prevDue'))||0,othersBill:fd.has('othersBill'),active:fd.has('active'),manager:fd.has('manager')};
    if(!o.name){return}
    if(o.manager&&db.members.filter(x=>x.manager&&x.id!==id).length>=2){toast('Only 2 managers allowed — turn off an existing manager first','err');return}
    if(id)Object.assign(db.members.find(m=>m.id===id),o);else db.members.push(Object.assign({id:uid('m')},o));
    save();closeModal();render(true);toast('Member saved');
  }else if(kind==='deposit'){
    const o={date:g('date'),memberId:g('memberId'),amount:Number(g('amount'))||0,note:g('note')};
    if(!o.memberId||o.amount<=0){toast('Pick a member from the search list and enter amount','err');return}
    if(id)Object.assign(db.deposits.find(d=>d.id===id),o);else db.deposits.push(Object.assign({id:uid('d')},o));
    save();closeModal();render(true);toast('Deposit saved');
  }else if(kind==='shop'){
    const o={date:g('date'),purchase:g('purchase'),costing:g('costing'),itemType:g('itemType'),item:g('item'),cost:Number(g('cost'))||0,qty:g('qty')};
    if(!o.item){return}
    if(id)Object.assign(db.shopping.find(s=>s.id===id),o);else db.shopping.push(Object.assign({id:uid('s')},o));
    save();closeModal();render(true);toast('Shopping saved');
    if(again)shopForm('',{date:o.date,purchase:o.purchase,costing:o.costing,itemType:o.itemType});
  }else if(kind==='settings'||kind==='settings2'){
    const S=db.settings;
    if(kind==='settings'){
      ['messName','month','manager','managerPhone','responsible','footNote','startDate','endDate'].forEach(k=>S[k]=g(k));
      if(S.endDate<S.startDate){S.endDate=S.startDate}
    }else{
      S.gasBill=Number(g('gasBill'))||0;S.helperName=g('helperName');S.helperCash=Number(g('helperCash'))||0;S.roundBills=fd.has('roundBills');
    }
    save();render(true);toast('Settings saved');
  }else if(kind==='mealw'){
    const n=k=>{const x=parseFloat(g(k));return isFinite(x)&&x>=0?Math.round(x*1000)/1000:0};
    db.settings.mealWeights={b:n('b'),l:n('l'),d:n('d')};
    save();closeModal();render(true);toast('Meal values saved — all totals recalculated');
  }else if(kind==='newmonth'){
    const c=calc(),carry=fd.has('carry');
    exportJSON();
    const prev={};c.rows.forEach(r=>prev[r.m.id]=Math.round(r.payable*100)/100);
    db.members.forEach(m=>m.prevDue=carry?(prev[m.id]||0):0);
    Object.assign(db.settings,{month:g('month'),startDate:g('startDate'),endDate:g('endDate')<g('startDate')?g('startDate'):g('endDate'),manager:g('manager'),gasBill:0,helperCash:0});
    db.deposits=[];db.meals={};db.shopping=[];ui.mealDate=null;
    save();closeModal();render();toast('New month started');
  }
});

/* ---------------------------------------------------------------- INIT */
db=loadDB();
if(!localStorage.getItem(DB_KEY)){try{localStorage.setItem(DB_KEY,JSON.stringify(db))}catch(e){}}
render();
initFile();
